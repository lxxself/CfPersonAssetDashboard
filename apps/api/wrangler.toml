name = "personal-asset-dashboard-api"
main = "src/index.ts"
compatibility_date = "2026-06-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "personal-asset-dashboard"
# Replace this with the database_id returned by `wrangler d1 create` in your account.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "ASSET_KV"
# Replace this with the id returned by `wrangler kv namespace create ASSET_KV`.
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
EXCHANGE_RATE_API_URL = "https://open.er-api.com/v6/latest/CNY"
